---
layout: default
---
<article class="post card">

  <header class="card-header editor-tab">
    <span class="editor-tab-dots" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="editor-tab-label">{{ page.title | slugify }}.md</span>
  </header>

  <div class="card-body">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {{ content }}
  </div>

</article>
