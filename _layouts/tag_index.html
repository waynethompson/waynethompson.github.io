---
layout: default
---

<article class="archive card">
    <div class="card-body">
        <header>
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="archive-intro">Posts tagged with "{{ page.tag | replace: '-', ' ' }}".</p>
        </header>

        <div class="archive-grid archive-grid-single">
            <section class="archive-group archive-card">
                {% for post in site.tags[page.tag] %}
                <article class="archive-item">
                    <time class="archive-date" datetime='{{post.date | date: "%Y-%m-%d"}}'>{{post.date | date: "%b %-d, %Y" }}</time>
                    <h4><a href='{{post.url}}'>{{post.title}}</a></h4>
                </article>
                {% endfor %}
            </section>
        </div>
    </div>
</article>
